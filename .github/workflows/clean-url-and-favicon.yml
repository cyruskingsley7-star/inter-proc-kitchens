name: Enable clean section URLs

on:
  push:
    paths:
      - '.github/workflows/clean-url-and-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update section links and browser navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          for section in ('work', 'craft', 'process', 'about', 'contact'):
              html = html.replace('href="#' + section + '" data-jump="' + section + '"', 'href="/' + section + '" data-jump="' + section + '"')
          html = html.replace('href="#top" data-jump="top"', 'href="/" data-jump="top"')
          before = "history.replaceState(null, '', window.location.pathname);"
          after = """const nextPath = link.dataset.jump === 'top' ? '/' : '/' + link.dataset.jump;
                if (window.location.pathname !== nextPath) history.pushState(null, '', nextPath);"""
          if before not in html and after not in html:
              raise SystemExit('Expected navigation history code not found; no changes made')
          html = html.replace(before, after, 1)
          marker = '// Preserve native links so WhatsApp and email can open their installed apps.'
          route_code = """// Deep links and browser Back/Forward return to the correct section.
          const showCurrentRoute = () => {
            const segment = window.location.pathname.replace(/^\\/+|\\/+$/g, '');
            const target = document.getElementById(segment || 'top');
            if (target) {
              target.scrollIntoView({ behavior: 'instant', block: 'start' });
              if (segment) target.focus({ preventScroll: true });
            }
          };
          window.addEventListener('load', showCurrentRoute, { once: true });
          window.addEventListener('popstate', showCurrentRoute);
          
          """
          if 'const showCurrentRoute = () =>' not in html:
              if marker not in html:
                  raise SystemExit('Expected navigation marker not found; no changes made')
              html = html.replace(marker, route_code + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit clean routes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Use clean URLs for Work, Craft, Process, About and Contact"
            git push
          fi
