name: Publish INTER-PROC kitchen transformation

on:
  push:
    paths:
      - 'interproc-transformation-photos.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add original before and after photos and section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          root=Path('.')
          archive=root/'interproc-transformation-photos.zip'
          if not archive.exists(): raise SystemExit('Upload interproc-transformation-photos.zip to the repository root first')
          with ZipFile(archive) as z:
              names=z.namelist()
              expected=[f'transformations/before-{i:02}.jpg' for i in range(1,5)]+[f'transformations/after-{i:02}.jpg' for i in range(1,9)]
              if sorted(names)!=sorted(expected): raise SystemExit(f'Expected 12 original photos. Found: {names}')
              z.extractall('.')
          p=root/'index.html'
          html=p.read_text(encoding='utf-8')
          if 'id="transformation"' in html: raise SystemExit('Transformation section already installed')
          css="""
          .transformation{padding:clamp(3.5rem,7vw,7rem) clamp(1.25rem,4vw,4.5rem);background:#f5f1ea;color:#1a1918;scroll-margin-top:6rem}
          .transformation .transform-intro{display:flex;justify-content:space-between;align-items:end;gap:2rem;margin-bottom:2rem}
          .transformation .transform-intro h2{font-family:Georgia,serif;font-size:clamp(2.2rem,5vw,5rem);font-weight:400;line-height:1.06;letter-spacing:-.035em;margin:.5rem 0 0}
          .transformation .transform-intro>p{max-width:355px;color:#66615c;font-size:.95rem;line-height:1.7}
          .transformation .transform-pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
          .transformation figure{margin:0;min-width:0}
          .transformation .transform-pair img{width:100%;height:clamp(300px,43vw,580px);object-fit:cover;display:block}
          .transformation figcaption{display:flex;justify-content:space-between;gap:1rem;padding:.85rem 0 1rem;border-bottom:1px solid #d7d0c7;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
          .transformation .transform-label{color:#cc001b}
          .transformation .transform-gallery-heading{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:3rem 0 1.2rem}
          .transformation .transform-gallery-heading h3{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.5rem,2.5vw,2.5rem)}
          .transformation .transform-gallery-heading p{font-size:.8rem;color:#716c67}
          .transformation .transform-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem}
          .transformation .transform-gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#dedbd5}
          .transformation .transform-gallery figcaption{font-size:.63rem;letter-spacing:.06em}
          .transformation .transform-cta{margin-top:2.4rem;display:inline-flex;gap:1rem;align-items:center;background:#cc001b;color:#fff;padding:1.15rem 1.45rem;text-decoration:none;font-size:.73rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
          @media(max-width:760px){.transformation .transform-intro{display:block}.transformation .transform-intro>p{margin-top:1rem}.transformation .transform-pair{grid-template-columns:1fr}.transformation .transform-pair img{height:auto;max-height:620px;aspect-ratio:3/4}.transformation .transform-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.transformation .transform-gallery-heading{display:block}}
          """
          section="""
          <section id="transformation" class="transformation scroll-section" tabindex="-1" aria-labelledby="transform-title">
          <div class="transform-intro"><div><p class="eyebrow">Before &amp; after · Real project</p><h2 id="transform-title">The transformation.</h2></div><p>From an empty tiled room to a fitted kitchen with tailored grey cabinetry, marble-look countertops and illuminated glass-fronted storage.</p></div>
          <div class="transform-pair" aria-label="Kitchen before and after installation">
          <figure><img src="/transformations/before-01.jpg" alt="Before: empty tiled kitchen with no fitted cabinetry" loading="lazy"><figcaption><span class="transform-label">01 / Before</span><span>Room ready for cabinetry</span></figcaption></figure>
          <figure><img src="/transformations/after-02.jpg" alt="After: installed grey kitchen cabinetry and marble-look countertops" loading="lazy"><figcaption><span class="transform-label">02 / After</span><span>Cabinetry installed</span></figcaption></figure>
          </div>
          <div class="transform-gallery-heading"><h3>The project, step by step.</h3><p>12 original on-site photographs</p></div>
          <div class="transform-gallery" aria-label="All before and after project photos">
          """
          for i in range(1,5):
              section+=f'<figure><img src="/transformations/before-{i:02}.jpg" alt="Before: kitchen room prepared for cabinetry" loading="lazy"><figcaption><span class="transform-label">Before</span><span>Site preparation</span></figcaption></figure>'
          for i in range(1,9):
              section+=f'<figure><img src="/transformations/after-{i:02}.jpg" alt="After: INTER-PROC fitted kitchen and installation work" loading="lazy"><figcaption><span class="transform-label">After</span><span>Cabinetry and finishing</span></figcaption></figure>'
          section+='</div><a class="transform-cta" href="https://wa.me/256752400883?text=Hello%20INTER-PROC%2C%20I%20saw%20your%20kitchen%20transformation%20and%20would%20like%20to%20discuss%20mine." target="_blank" rel="noopener noreferrer">Discuss your kitchen ↗</a></section>'
          if '</style>' not in html: raise SystemExit('Missing style closing tag')
          html=html.replace('</style>',css+'\n</style>',1)
          m=re.search(r'<section\s+id="craft"',html)
          if not m: raise SystemExit('Could not locate the existing Craft section')
          html=html[:m.start()]+section+'\n'+html[m.start():]
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit transformed website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html transformations
          git commit -m "Add original before and after kitchen photo gallery"
          git push
