name: Publish clear kitchen before and after
on:
  push:
    paths:
      - '.github/workflows/publish-clear-transformation.yml'
      - 'scripts/refine_transformation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Improve the kitchen project story
        run: python3 scripts/refine_transformation.py
      - name: Publish updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Clarify before and after with three stages and remove duplicate photo grid" && git push)
